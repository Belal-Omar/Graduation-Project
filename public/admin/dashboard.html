<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Sential AI</title>
  <link rel="stylesheet" href="/admin/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2 4.5 5v6c0 5 3.2 8.7 7.5 11 4.3-2.3 7.5-6 7.5-11V5z'/></svg>">
</head>
<body class="sential-dashboard">

  <!-- Top Navigation Bar -->
  <header class="sential-topbar">
    <div class="topbar-left">
      <div class="brand-container">
        <div class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 4.5 5v6c0 5 3.2 8.7 7.5 11 4.3-2.3 7.5-6 7.5-11V5z"/>
            <path d="m8.5 12 2.2 2.2 4.8-5"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">
            Sential <span class="brand-ai">AI</span>
          </div>
          <div class="brand-tagline">Autonomous Security</div>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <div class="admin-chip">
        <span id="navAdminName" style="font-weight: 700; color: #0f172a;">Admin</span>
        <span class="admin-role-badge">ADMIN</span>
      </div>

      <button id="logoutBtn" class="btn-signout" title="Sign Out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sign Out
      </button>
    </div>
  </header>

  <!-- Empty Dashboard Area for the Dashboard Team -->
  <main class="dashboard-content-area" style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 70vh;">
    
    <div style="background: #ffffff; border: 2px dashed #cbd5e1; border-radius: 1.2rem; padding: 4rem 2rem; max-width: 600px; width: 100%; text-align: center; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);">
      
      <div style="width: 64px; height: 64px; background: #eff6ff; color: #2563eb; border-radius: 1rem; display: grid; place-items: center; margin: 0 auto 1.5rem;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M9 3v18"/>
          <path d="m14 9 3 3-3 3"/>
        </svg>
      </div>

      <h1 style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem; letter-spacing: -0.02em;">
        Admin Dashboard
      </h1>
      
      <p style="color: #64748b; font-size: 0.95rem; line-height: 1.6; max-width: 440px; margin: 0 auto 1.8rem;">
        Login authentication and role verification (<code>role = admin</code>) completed successfully. This workspace is ready for the Dashboard UI team.
      </p>

      <div style="display: inline-flex; align-items: center; gap: 8px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 700;">
        <span style="width: 8px; height: 8px; background: #22c55e; border-radius: 50%;"></span>
        Logged in as Administrator (Verified)
      </div>

    </div>

  </main>

  <script src="/admin/js/dashboard.js"></script>
</body>
</html>
